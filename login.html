<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DriveNow - Login</title>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- font awesome css -->
    <link rel="stylesheet" href="css/all.min.css">

    <!-- my css -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<!-- start top bar -->

<div class="top_bar">

    <p class="mb-0">
        DriveNow - Your journey starts here
    </p>

</div>

<!-- end top bar -->


<!-- start navbar -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="home.html">
            DriveNow
        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

            <i class="fa-solid fa-bars"></i>

        </button>


        <div class="collapse navbar-collapse" id="navbar">

            <ul class="navbar-nav ms-auto">


                <!-- Home -->

                <li class="nav-item">

                    <a class="nav-link" href="home.html">
                        Home
                    </a>

                </li>


                <!-- Cars -->

                <li class="nav-item">

                    <a class="nav-link" href="cars.html">
                        Cars
                    </a>

                </li>


                <!-- Offers -->

                <li class="nav-item">

                    <a class="nav-link" href="offers.html">
                        Offers
                    </a>

                </li>


                <!-- Locations -->

                <li class="nav-item">

                    <a class="nav-link" href="locations.html">
                        Locations
                    </a>

                </li>


                <!-- About -->

                <li class="nav-item">

                    <a class="nav-link" href="about.html">
                        About Us
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- end navbar -->


<!-- start login -->

<section class="login_section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="login_box">


                    <!-- title -->

                    <div class="login_title text-center">

                        <span>
                            WELCOME BACK
                        </span>

                        <h1>
                            Login to DriveNow
                        </h1>

                        <p>
                            Login to manage your bookings and account.
                        </p>

                    </div>


                    <!-- email -->

                    <label>
                        Email
                    </label>

                    <div class="input_box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="login_email"
                            placeholder="Enter your email">

                    </div>


                    <!-- password -->

                    <label>
                        Password
                    </label>

                    <div class="input_box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="login_password"
                            placeholder="Enter your password">

                    </div>


                    <!-- remember -->

                    <div class="remember_box">

                        <input
                            type="checkbox"
                            id="remember">

                        <label for="remember">
                            Remember me
                        </label>

                    </div>


                    <!-- login button -->

                    <a href="javascript:void(0);"
                       class="login_submit rounded-pill"
                       onclick="loginUser()">

                        Login

                    </a>


                    <!-- signup -->

                    <p class="register_text text-center">

                        Don't have an account?

                        <a href="signup.html">
                            Sign up
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- end login -->


<script src="js/bootstrap.bundle.min.js"></script>

<script src="js/drivenow.js"></script>

</body>

</html>
